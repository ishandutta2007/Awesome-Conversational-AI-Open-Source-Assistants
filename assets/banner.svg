<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Accent Gradient for Title & Highlights -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <!-- Filters for Glow Effect -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulsing-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .pulsing-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .flowing-particle {
        animation: flowParticle 6s linear infinite;
      }
      .badge-glow {
        animation: badgeFloat 4s ease-in-out infinite alternate;
      }

      @keyframes pulse1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        100% { transform: translate(60px, 40px) scale(1.3); opacity: 0.55; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
        100% { transform: translate(-50px, -30px) scale(1.25); opacity: 0.5; }
      }
      @keyframes flowParticle {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmospheric Orbs (Always behind text) -->
  <g>
    <circle class="pulsing-orb-1" cx="200" cy="120" r="220" fill="url(#glowGrad1)" filter="url(#softGlow)" />
    <circle class="pulsing-orb-2" cx="1020" cy="280" r="260" fill="url(#glowGrad2)" filter="url(#softGlow)" />
    <circle class="pulsing-orb-1" cx="600" cy="380" r="180" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  </g>

  <!-- Technical Grid Pattern Overlay -->
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Dynamic Circuit / Flow Lines (Background Ambient) -->
  <g fill="none" opacity="0.6">
    <path d="M -50 200 C 300 280, 450 100, 750 240 C 950 330, 1100 120, 1250 180" 
          stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 12" class="flowing-particle" />
    <path d="M -50 280 C 250 140, 550 320, 850 160 C 1050 60, 1150 240, 1250 260" 
          stroke="#818cf8" stroke-width="1.2" stroke-dasharray="8 8" class="flowing-particle" style="animation-duration: 9s;" />
  </g>

  <!-- Animated Ambient Floating Nodes -->
  <g opacity="0.7">
    <circle cx="150" cy="90" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="110" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="320" r="2.5" fill="#818cf8">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="310" r="2.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Safe Layer to Ensure Foreground Visibility -->
  <g id="foreground-content">
    <!-- Top Category Pill Tag -->
    <g class="badge-glow" transform="translate(600, 72)">
      <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="-160" cy="0" r="4.5" fill="#38bdf8">
        <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="1.2">
        CURATED ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Conversational AI &amp; Open Source Assistants
    </text>

    <!-- Subtitle -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
      Self-Hosted ChatGPT Clones • Local AI Desktops • Enterprise RAG &amp; Agent Workspaces
    </text>

    <!-- Description Details -->
    <text x="600" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Comprehensive curated collection of local model runners, BYOK clients, multi-model frontends &amp; autonomous agent canvases
    </text>

    <!-- Feature Pills at the Bottom -->
    <g transform="translate(600, 310)">
      <!-- Pill 1: Open WebUI -->
      <g transform="translate(-400, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">⚡ Open WebUI</text>
      </g>
      <!-- Pill 2: LibreChat -->
      <g transform="translate(-200, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">🛡️ LibreChat</text>
      </g>
      <!-- Pill 3: Dify & Agents -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#a855f7">🤖 Dify Workflows</text>
      </g>
      <!-- Pill 4: Local RAG -->
      <g transform="translate(195, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">📂 AnythingLLM</text>
      </g>
      <!-- Pill 5: Offline AI -->
      <g transform="translate(390, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">🔒 Jan.ai &amp; Ollama</text>
      </g>
    </g>
  </g>
</svg>
